name: Build-Curl

on:
  push:
    branches:
      - main

permissions: 
  contents: read
  id-token: write

jobs:
  build-and-curl:
    runs-on: ubuntu-latest
    steps:
      - name: get-code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: docker-build
        run: |
          docker build -t pipeline-test .

      - name: docker-run
        env:
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY_PROD }} 
        run: |
          docker run -d -p 8000:8000 -e DJANGO_SECRET_KEY="$DJANGO_SECRET_KEY" pipeline-test

      - name: curl-ftw
        run: |
          sleep 10
          curl -f http://localhost:8000/

  sbom-scan-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: get_code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: sbom_gen_and_scan
        uses: ./.github/actions/sbom-scan

      - name: upload_sbom
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: project-sbom
          path: sbom.json
          compression-level: 0
